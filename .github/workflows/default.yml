# This is a basic workflow to help you get started with Actions

name: bwrap_many_archs_static
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Compile and extract artifacts from docker container
      run: |
        echo 'build again'
        mkdir -p dist
          for platform in linux/amd64 linux/arm64 linux/arm/v7 linux/386; do
            arch=$(echo "${platform}" | cut -d'/' -f2)
            echo "Construindo para ${arch}..."
            docker build --no-cache --platform "${platform}" -t alpine:bwrap .
            docker run --rm --platform "${platform}" -v "$(pwd):/workdir" alpine:bwrap cp /usr/local/bin/bwrap "/workdir/dist/bwrap-${arch}"
          done

    - name: Set permissions for dist directory
      run: |
        echo $PATH
        sudo chown -R "$(id -u)":"$(id -g)" dist/
        sudo chmod -R 766 dist/

    - name: Upload artifacts to release
      uses: actions/upload-artifact@v4
      with:
        name: bwrap
        path: 'dist'

    - name: Compute Short SHA
      id: ssha
      run: |
        echo "ssha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    outputs:
      ssha: ${{ steps.ssha.outputs.ssha }}


  release:
      permissions: write-all
      needs: [build]
      runs-on: ubuntu-latest

      steps:
        - uses: actions/download-artifact@v4
          with:
            name: bwrap

        - name: release
          uses: marvinpinto/action-automatic-releases@latest
          with:
            title: Continuous ${{ needs.build.outputs.ssha }}
            automatic_release_tag: ${{ needs.build.outputs.ssha }}
            prerelease: false
            draft: false
            files: |
              *bwrap*
            repo_token: ${{ secrets.GITHUB_TOKEN }}
